name: Nightly smoke

# The slower end-to-end smokes that need the Electron app: account switching and offline
# sync, the local CBZ reader, and a restore that survives a restart. Windows, because that
# is what the desktop app ships for and Electron needs a desktop session to start.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Only to open the failure issue below.
  issues: write

jobs:
  desktop-smoke:
    name: Desktop and restore smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The repository's default branch (main). A scheduled run already checks it out; this
      # used to name a `development` branch that doesn't exist, so every run failed here.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@projekt-manga/server
        env:
          DATABASE_URL: file:./data/ci-generate.db

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx --workspace=@projekt-manga/extensions playwright install chromium

      - name: Smoke — desktop
        run: npm run smoke -- desktop

      - name: Smoke — restore across a restart
        run: npm run smoke:restore-restart
        env:
          # It builds the server first, and prisma.config.ts resolves DATABASE_URL even just
          # to generate the client. The smoke gives its own server a throwaway database.
          DATABASE_URL: file:./data/ci-generate.db

      # A scheduled run has nobody watching it, so a failure opens one issue and adds to it
      # on later nights instead of passing unnoticed.
      - name: Report a failed night
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly smoke is failing'
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "First failed run: $RUN_URL"
          fi
