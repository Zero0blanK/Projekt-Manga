openapi: 3.0.3
info:
  title: ProjektManga API
  description: >
    Server API for ProjektManga. All responses share a common envelope:
    `{ success: boolean, message: string, data?: T }` on success,
    `{ success: false, message: string, code?: string, errors?: object }` on error, where
    `errors` holds field messages on a `VALIDATION_ERROR`. Routes marked host-level take
    an `X-Admin-Token` when the server sets `ADMIN_TOKEN`.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development (default SERVER_PORT)

tags:
  - name: Manga
  - name: Category
  - name: Chapter
  - name: History
  - name: Downloads
  - name: Sources
  - name: Cache
  - name: Health
  - name: Auth
  - name: Library
  - name: Trackers
  - name: Extensions
  - name: Sync
  - name: Backup
  - name: Suwayomi
  - name: Translate

paths:
  # ── Manga ──────────────────────────────────────────────────────────────
  /manga:
    get:
      tags: [Manga]
      summary: List the library, all of it unless paged
      parameters:
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/MangaListItemArray'

  /manga/details/{manga_id}:
    get:
      tags: [Manga]
      summary: Get a manga with its detail fields and full chapter list
      parameters:
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MangaWithDetails'
        '404':
          $ref: '#/components/responses/Error'

  /manga/{manga_id}:
    get:
      tags: [Manga]
      summary: Get a manga by id or slug
      parameters:
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Manga'

  /manga/add:
    post:
      tags: [Manga]
      summary: Add a manga to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMangaPayload'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Manga'
        '409':
          description: A manga with the same title or slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /manga/{manga_id}/migrate:
    post:
      tags: [Manga]
      summary: Migrate a library entry's reading state onto another entry
      description: >-
        Moves reading progress, shelf, rating, category tags and history from the entry in
        the path onto `to_manga_id` — the "switch this series to a different source" flow.
        Runs in a single transaction, so it either lands completely or not at all.
        Chapters are matched by number rather than id, since two sources never share
        chapter ids. Works signed in or not: with a session the per-account overlay tables
        are migrated, without one the shared rows are.
      parameters:
        - name: manga_id
          in: path
          required: true
          description: The entry being migrated *from*. Must already exist.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_manga_id]
              properties:
                to_manga_id:
                  type: string
                  description: The entry being migrated *to*. Must already exist.
                remove_old:
                  type: boolean
                  default: true
                  description: Take the old entry out of the library once everything has moved.
                move_history:
                  type: boolean
                  default: true
                  description: >-
                    Re-point this title's history rows at the new entry. History keeps its
                    own source and slug, so this preserves where each chapter was read.
      responses:
        '200':
          description: Migrated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          progress:
                            type: integer
                            description: Furthest chapter number read on the old entry.
                          chapters_marked:
                            type: integer
                          categories_moved:
                            type: integer
                          history_moved:
                            type: integer
                          state_copied:
                            type: boolean
                          old_entry_removed:
                            type: boolean
        '400':
          description: Missing destination, or an attempt to migrate a title onto itself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: One of the titles no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /notification-channels:
    get:
      tags: [Notifications]
      summary: The caller's new-chapter alert channels (ntfy, Discord, Telegram, webhook)
      description: Destinations are never returned, only their host.
      responses:
        '200':
          description: The channels
    post:
      tags: [Notifications]
      summary: Add an alert channel
      description: >-
        The destination is stored encrypted. Changing the anonymous library's channels needs
        the host admin check; an account's own need only the account.
      responses:
        '201':
          description: The channel, without its destination
        '400':
          description: The destination doesn't fit the kind, or there are already 10 channels

  /notification-channels/alert:
    post:
      tags: [Notifications]
      summary: Send what one library update found to every enabled channel
      description: >-
        At most once every 30 seconds per caller. Destinations must be public addresses
        unless the server sets ALERTS_ALLOW_PRIVATE_HOSTS=true.
      responses:
        '200':
          description: How many channels took the alert

  /notification-channels/{channel_id}:
    patch:
      tags: [Notifications]
      summary: Rename a channel or switch it on or off
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated channel
    delete:
      tags: [Notifications]
      summary: Remove a channel
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed

  /notification-channels/{channel_id}/test:
    post:
      tags: [Notifications]
      summary: Send a test message, saving the outcome on the channel
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The channel, with last_sent_at or last_error updated

  /translate/status:
    get:
      tags: [Reader]
      summary: Whether page translation is set up, and with which service
      responses:
        '200':
          description: '{ enabled, provider: libretranslate | deepl | null, source: ja }'

  /translate:
    post:
      tags: [Reader]
      summary: Translate Japanese text read off a page on the device
      description: >-
        Body `{ texts: string[] (1–60, each ≤2000 chars), target }`. The source is always
        Japanese. The service is set by TRANSLATE_PROVIDER, TRANSLATE_URL and
        TRANSLATE_API_KEY; only the text is sent to it. At most 30 uncached calls a minute
        per caller.
      responses:
        '200':
          description: '{ translations: string[] } in the order of texts'
        '429':
          description: Too many translations in the last minute
        '502':
          description: The translation service failed (its status only, never the key)
        '503':
          description: Translation is not set up on this server

  /manga/links/all:
    get:
      tags: [Manga]
      summary: Every linked-source group of the caller (signed-in account or anonymous library)
      description: Used by library updates, which also check each title's linked sources.
      responses:
        '200':
          description: Groups of a primary title and its linked titles, in priority order

  /manga/{manga_id}/links:
    get:
      tags: [Manga]
      summary: A title's linked sources (other sources' copies of it)
      description: >-
        Asking with a linked title returns its primary's group. Per identity: an account's
        links, or the anonymous library's.
      parameters:
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: The primary's id and its links in the order they are tried
    post:
      tags: [Manga]
      summary: Link another source's copy under this title
      description: >-
        Refused (400) for a title linked to itself, a chain (the primary is itself linked,
        or the linked title has links of its own), a title already linked elsewhere, or
        more than 20 links.
      parameters:
        - $ref: '#/components/parameters/MangaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linked_manga_id]
              properties:
                linked_manga_id: { type: string }
      responses:
        '201':
          description: The updated group
        '400':
          description: The link breaks a rule above
        '404':
          description: Either title does not exist

  /manga/{manga_id}/links/order:
    put:
      tags: [Manga]
      summary: Set the order linked sources are tried in
      parameters:
        - $ref: '#/components/parameters/MangaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_ids]
              properties:
                link_ids:
                  type: array
                  description: Every link of the title, once each
                  items: { type: string }
      responses:
        '200':
          description: The updated group
        '400':
          description: The list is not exactly the title's links

  /manga/{manga_id}/links/{link_id}:
    delete:
      tags: [Manga]
      summary: Unlink one source
      parameters:
        - $ref: '#/components/parameters/MangaId'
        - name: link_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated group
        '404':
          description: No such link for this title and caller

  /manga/{manga_id}/override:
    patch:
      tags: [Manga]
      summary: Edit how a title looks for this reader
      description: >-
        Lays the reader's own title, author, description or status over the shared
        catalog. Library updates and details refreshes keep writing the catalog; reads of
        the library and details merge these edits and add an `override` object with the
        catalog values under `original`. Per identity: an account edits its own row,
        anonymous use the shared one. An omitted field is unchanged; null clears it.
      parameters:
        - name: manga_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, nullable: true, minLength: 1, maxLength: 255 }
                author: { type: string, nullable: true, minLength: 1, maxLength: 255 }
                description: { type: string, nullable: true, maxLength: 20000 }
                status:
                  type: string
                  nullable: true
                  enum: [ONGOING, COMPLETED, HIATUS, CANCELLED, UNKNOWN]
      responses:
        '200':
          description: The stored edit, or null once every field is cleared
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Manga]
      summary: Reset a title to the source's details
      description: Drops every edit for this identity, the custom cover included.
      parameters:
        - name: manga_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reset
        '404':
          $ref: '#/components/responses/Error'

  /manga/{manga_id}/override/cover:
    post:
      tags: [Manga]
      summary: Upload a custom cover
      description: >-
        Base64 image data in JSON (writes accept JSON only). The decoded bytes must match
        the declared type's signature and be at most 5 MB. Served from
        /cache/thumbnail/{manga_id} in place of the cached source cover.
      parameters:
        - name: manga_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mime, data]
              additionalProperties: false
              properties:
                mime:
                  type: string
                  enum: [image/jpeg, image/png, image/gif, image/webp, image/avif]
                data:
                  type: string
                  format: byte
      responses:
        '200':
          description: Cover saved
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Manga]
      summary: Go back to the source's cover
      description: Removes the custom cover and keeps any other edits.
      parameters:
        - name: manga_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cover reset
        '404':
          $ref: '#/components/responses/Error'

  /manga/{category_id}/{manga_slug}/add:
    post:
      tags: [Manga]
      summary: Add a manga to a category
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/MangaSlug'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MangaCategoryLink'
        '404':
          $ref: '#/components/responses/Error'

  /manga/{manga_id}/delete:
    delete:
      tags: [Manga]
      summary: Remove a manga from the library
      description: >
        Cascades: category links are removed; if the manga has read history, its
        chapters/history are detached (manga_id set to null) rather than deleted; otherwise
        its chapters are deleted outright.
      parameters:
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/Error'

  /manga/category/{category_id}:
    get:
      tags: [Manga]
      summary: List manga in a category
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          $ref: '#/components/responses/MangaListItemArray'

  /library/release-estimates:
    get:
      tags: [Manga]
      summary: When each library title's next chapter is expected
      description: >
        The median gap between the title's last few distinct chapter releases (the
        source's release date, or when the server first saw the chapter). Titles with
        fewer than three dated releases, or a gap longer than 60 days, are omitted.
        Membership follows the session: the account's library, or the shared library
        without one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [manga_id, interval_days, next_expected_at, last_chapter_at]
                      properties:
                        manga_id: { type: string }
                        interval_days: { type: number }
                        next_expected_at: { type: string, format: date-time }
                        last_chapter_at: { type: string, format: date-time }

  # ── Category ───────────────────────────────────────────────────────────
  /category:
    get:
      tags: [Category]
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

  /category/{category_id}:
    get:
      tags: [Category]
      summary: Get a category by id
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/Error'

  /category/add:
    post:
      tags: [Category]
      summary: Create a category
      description: The id is derived from the name (lowercased, spaces → hyphens).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name: { type: string, minLength: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '400':
          description: Empty/missing category_name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: A category with the same name (case-insensitive) already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /category/update/{category_id}:
    put:
      tags: [Category]
      summary: Rename a category
      description: >
        Renaming changes the category's id too (it's derived from the name), which
        cascades to manga_category.category_id via the database's ON UPDATE CASCADE.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name: { type: string, minLength: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '400':
          description: Empty/missing category_name
        '409':
          description: A category with the same name already exists

  /category/delete/{category_id}:
    delete:
      tags: [Category]
      summary: Delete a category
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: OK

  # ── Chapter ────────────────────────────────────────────────────────────
  /chapter/{manga_slug}/{source_chapter_key}/mark-read:
    post:
      tags: [Chapter]
      summary: Mark a chapter as read
      description: >
        The chapter is named by the source's own id for it within the title (`manga_slug`
        plus the body's `source`, which may be omitted only when one stored title has this
        slug). If no stored row has that key yet (e.g. read directly from a source before
        the manga was added to the library), one is created first from the body metadata.
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
        - $ref: '#/components/parameters/SourceChapterKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterMeta'
      responses:
        '200':
          description: OK

  /chapter/{manga_slug}/{source_chapter_key}/mark-unread:
    post:
      tags: [Chapter]
      summary: Mark a chapter as unread
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
        - $ref: '#/components/parameters/SourceChapterKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterMeta'
      responses:
        '200':
          description: OK

  /chapter/{manga_slug}/{source_chapter_key}/{last_page_read}/mark-by-page:
    post:
      tags: [Chapter]
      summary: Record reading progress by page number
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
        - $ref: '#/components/parameters/SourceChapterKey'
        - name: last_page_read
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterMeta'
      responses:
        '200':
          description: OK
        '400':
          description: last_page_read is not a number

  /chapter/{manga_slug}/bulk-mark-read:
    post:
      tags: [Chapter]
      summary: Mark multiple chapters as read (e.g. "mark previous chapters read")
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chapters:
                  type: array
                  items: { $ref: '#/components/schemas/ChapterMeta' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BulkMarkResult' }

  /chapter/{manga_slug}/bulk-mark-unread:
    post:
      tags: [Chapter]
      summary: Mark multiple chapters as unread
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chapters:
                  type: array
                  items: { $ref: '#/components/schemas/ChapterMeta' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BulkMarkResult' }

  /chapter/add-history:
    post:
      tags: [Chapter]
      summary: Store a chapter read before any list had it (linked to a manga when one exists)
      description: >
        `id` is the source's own id for the chapter; `source` and `manga_slug` scope it.
        Returns the existing row when one already holds that key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ChapterMeta'
                - type: object
                  required: [id, source, manga_slug]
                  properties:
                    manga_slug: { type: string }
      responses:
        '201':
          description: Created

  /chapter/{chapter_id}/progress:
    get:
      tags: [Chapter]
      summary: Get last_page_read/is_read for a chapter
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
                        type: object
                        properties:
                          last_page_read: { type: integer }
                          is_read: { type: boolean }

  /chapter/recent:
    get:
      tags: [Chapter]
      summary: The 10 most recently fetched chapters across the whole library
      responses:
        '200':
          description: OK

  /chapter/status/{chapter_id}:
    get:
      tags: [Chapter]
      summary: Get is_read for a chapter
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: OK

  /chapter/{manga_slug}:
    get:
      tags: [Chapter]
      summary: List a manga's chapters
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
      responses:
        '200':
          description: OK
        '404':
          description: Manga not found

  # ── History ────────────────────────────────────────────────────────────
  /history:
    get:
      tags: [History]
      summary: List reading history (most recent first), all of it unless paged
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK

  /history/add:
    post:
      tags: [History]
      summary: Record/update reading progress
      description: >
        Upserts by (source, manga_slug, source_chapter_key): if a matching row exists, pages_read/
        time_read are updated (time_read accumulates) instead of creating a duplicate row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MangaHistoryInput'
      responses:
        '201':
          description: Created/updated

  /history/{manga_slug}:
    get:
      tags: [History]
      summary: Get history entries for one manga
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
      responses:
        '200':
          description: OK

  # ── Downloads ──────────────────────────────────────────────────────────
  /downloads/chapter:
    post:
      tags: [Downloads]
      summary: Queue a chapter for download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, mangaSlug, mangaTitle, chapter]
              properties:
                sourceId: { type: string }
                mangaSlug: { type: string }
                mangaTitle: { type: string }
                downloadPath: { type: string }
                chapter:
                  type: object
                  required: [id, chapter_number]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    chapter_number: { type: number }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string, example: PENDING }
                          progress: { type: integer, example: 0 }
                          message: { type: string }
        '400':
          description: chapter.id missing
        '404':
          description: Manga not found

  /downloads/stats:
    get:
      tags: [Downloads]
      summary: Aggregate download statistics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DownloadStats' }

  /downloads/chapter/{chapterId}/check:
    get:
      tags: [Downloads]
      summary: Check whether a chapter has a completed download
      parameters:
        - $ref: '#/components/parameters/ChapterIdCamel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isDownloaded: { type: boolean }

  /downloads/chapter/{chapterId}/pages:
    get:
      tags: [Downloads]
      summary: List local page files for an offline-read chapter
      parameters:
        - $ref: '#/components/parameters/ChapterIdCamel'
      responses:
        '200':
          description: OK
        '404':
          description: Not downloaded, or the files are missing on disk

  /downloads/chapter/{chapterId}/cbz:
    get:
      tags: [Downloads]
      summary: Export a downloaded chapter as a CBZ file
      description: >-
        Streams the chapter's downloaded pages as an uncompressed ZIP (CBZ), in reading
        order, named page_001 and so on. Not a JSON envelope: the body is the file.
      parameters:
        - $ref: '#/components/parameters/ChapterIdCamel'
      responses:
        '200':
          description: The CBZ file
          content:
            application/vnd.comicbook+zip:
              schema: { type: string, format: binary }
        '404':
          description: Not downloaded, or the files are missing on disk

  /downloads/directory:
    get:
      tags: [Downloads]
      summary: Get the active download directory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          path: { type: string }
    patch:
      tags: [Downloads]
      summary: Set (or reset, if path is omitted/empty) the download directory
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
      responses:
        '200':
          description: OK

  /downloads:
    get:
      tags: [Downloads]
      summary: List downloads, all of them unless paged
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DownloadSummary' }

  /downloads/{downloadId}:
    get:
      tags: [Downloads]
      summary: Get one download's status
      parameters:
        - $ref: '#/components/parameters/DownloadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DownloadStatusResponse' }
        '404':
          description: Not found
    delete:
      tags: [Downloads]
      summary: Cancel an active download, or delete a finished one's files + record
      parameters:
        - $ref: '#/components/parameters/DownloadId'
      responses:
        '200':
          description: OK

  /downloads/{downloadId}/pause:
    patch:
      tags: [Downloads]
      summary: Pause a queued/in-progress download
      parameters:
        - $ref: '#/components/parameters/DownloadId'
      responses:
        '200':
          description: OK
        '400':
          description: Download already finished (COMPLETED/FAILED)
        '404':
          description: Not found

  /downloads/{downloadId}/resume:
    patch:
      tags: [Downloads]
      summary: Resume a paused download
      parameters:
        - $ref: '#/components/parameters/DownloadId'
      responses:
        '200':
          description: OK
        '400':
          description: Download already finished (COMPLETED/FAILED)
        '404':
          description: Not found

  /downloads/events:
    get:
      tags: [Downloads]
      summary: Server-Sent Events stream of live download progress
      description: >
        text/event-stream. Events: `connected` (initial worker status snapshot),
        `progress` ({downloadId, currentPage, totalPages, pagesDownloaded}),
        `complete` ({downloadId}), `failed` ({downloadId}). Not part of the
        {success,message,data} envelope — this is a raw SSE stream.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream: {}

  # ── Sources (manga-source extensions) ─────────────────────────────────
  /source/sources:
    get:
      tags: [Sources]
      summary: List loaded manga sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SourceSummary' }

  /source/{source_id}/manga:
    get:
      tags: [Sources]
      summary: Browse a source's manga listing
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: category
          in: query
          schema: { type: string, default: latest }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/FiltersQuery'
      responses:
        '200':
          description: OK
        '503':
          description: Unknown source_id

  /source/{source_id}/search:
    get:
      tags: [Sources]
      summary: Search a source
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: query
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/FiltersQuery'
      responses:
        '200':
          description: OK

  /source/{source_id}/manga/{manga_id}:
    get:
      tags: [Sources]
      summary: Get manga details directly from the source
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: OK

  /source/{source_id}/manga/{manga_id}/thumbnail:
    get:
      tags: [Sources]
      summary: Get just the thumbnail URL from the source
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: OK

  /source/{source_id}/chapter/{chapter_id}/pages:
    get:
      tags: [Sources]
      summary: Get a chapter's page image URLs from the source
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: chapter_id
          in: path
          required: true
          description: The source's own id for the chapter, unique only within its title.
          schema: { type: string }
        - name: manga_slug
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK

  /source/{source_id}/filters:
    get:
      tags: [Sources]
      summary: Get a source's available browse/search filters
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: OK

  /source/{source_id}/keys-from-urls:
    post:
      tags: [Sources]
      summary: Turn Mihon/Tachiyomi URLs into this source's title slugs and chapter keys
      description: >
        Used by the Mihon/Tachiyomi backup import. Runs the source's optional keyFromUrl in
        its sandbox; no network request is made. At most 5,000 URLs per request. A source
        without keyFromUrl answers supported=false with every key null.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manga: { type: array, items: { type: string, maxLength: 2048 } }
                chapters: { type: array, items: { type: string, maxLength: 2048 } }
      responses:
        '200':
          description: One key per URL, in request order; null where unrecognised.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          supported: { type: boolean }
                          manga: { type: array, items: { type: string, nullable: true } }
                          chapters: { type: array, items: { type: string, nullable: true } }
        '400':
          description: Invalid body
        '429':
          description: Rate limited

  /source/{source_id}/browser-session:
    description: >
      Cookies a real browser earned for a source (a passed Cloudflare challenge, a login),
      captured by the desktop app's source window or pasted from the reader's own browser.
      Admin-only. Cookies are stored encrypted with TOKEN_ENCRYPTION_KEY and their values are
      never returned; responses describe the session only.
      Only useful when the server runs on the same machine as that browser, because
      Cloudflare ties its clearance to the IP and User-Agent that passed the challenge.
    get:
      tags: [Sources]
      summary: Describe the stored browser session for a source
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SourceBrowserSessionStatus'
        '403':
          $ref: '#/components/responses/Error'
    put:
      tags: [Sources]
      summary: Replace a source's browser session with captured cookies
      description: >
        Cookies for hosts outside the source's allowed_hosts are dropped. Without `cookies`,
        only the User-Agent changes and the stored cookies are kept (400 when there are none).
        Responds 503 when the server has no TOKEN_ENCRYPTION_KEY.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userAgent]
              properties:
                userAgent: { type: string, maxLength: 512 }
                cookies:
                  type: array
                  maxItems: 300
                  items:
                    type: object
                    required: [name, value, domain]
                    properties:
                      name: { type: string, maxLength: 256 }
                      value: { type: string, maxLength: 4096 }
                      domain: { type: string, maxLength: 253 }
                      hostOnly: { type: boolean }
                      path: { type: string }
                      secure: { type: boolean }
                      httpOnly: { type: boolean }
                      expires: { type: number, description: Unix seconds }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SourceBrowserSessionStatus'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Sources]
      summary: Forget a source's browser session
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Error'

  /source/{source_id}/manga/{manga_slug}/updates:
    post:
      tags: [Sources]
      summary: Check a source for new chapters and persist any that are new
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/MangaSlug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                manga_id: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          newChapters: { type: integer }
                          thumbnail_url: { type: string }

  /source-network:
    description: >
      User-Agent and DNS over HTTPS resolver for requests installed (sandboxed) sources
      make. Admin-only. SOURCE_USER_AGENT and SOURCE_DOH_URL supply the defaults. Neither
      setting changes which hosts a source may reach: the allowlist and the public-address
      check still run on every address the resolver returns.
    get:
      tags: [Sources]
      summary: Get the source network settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SourceNetworkConfig'
        '403':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Sources]
      summary: Change the source network settings
      description: Omitted fields are left alone; null turns a setting off, overriding the environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userAgent:
                  type: string
                  nullable: true
                  maxLength: 512
                  description: Printable ASCII only.
                dohUrl:
                  type: string
                  nullable: true
                  maxLength: 2048
                  description: https resolver URL (JSON API), without credentials.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SourceNetworkConfig'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /source/image-proxy:
    get:
      tags: [Sources]
      summary: Proxy an image from a manga source (avoids browser CORS/hotlink issues)
      description: >
        Streams the upstream response through as-is (not the {success,message,data}
        envelope). The target URL is validated against private/loopback/link-local IP
        ranges before fetching (SSRF guard) — same protection is re-checked on redirects.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: source_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Proxied image bytes
        '400':
          description: Missing/invalid/disallowed url
        '404':
          description: The source answered 404/410 for the image; remembered for an hour
        '502':
          description: The source failed or did not return a valid raster image

  # ── Cache (thumbnail caching) ──────────────────────────────────────────
  /cache/sync/{manga_id}:
    post:
      tags: [Cache]
      summary: Force a fresh cached copy of a manga's thumbnail and repoint manga.thumbnail_url
      parameters:
        - $ref: '#/components/parameters/MangaId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source_thumbnail_url: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated: { type: boolean }
                          hostedUrl: { type: string }
        '404':
          description: Manga not found

  /cache/status/{manga_id}:
    get:
      tags: [Cache]
      summary: Get cache status for a manga's thumbnail
      parameters:
        - $ref: '#/components/parameters/MangaId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CacheStatus' }

  # ── Health ─────────────────────────────────────────────────────────────
  # Operational endpoints. Unauthenticated: whatever supervises the process — a reverse
  # proxy, systemd, the desktop app's own server supervisor — has no session to present.
  /health:
    get:
      tags: [Health]
      summary: Liveness — the process is up
      description: >
        Queries nothing, so it is safe to poll frequently and cannot report a broken
        database. Use /health/ready for that.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [ok] }
                          timestamp: { type: string, format: date-time }
                          endpoints:
                            type: array
                            items: { type: string }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness — the database answers
      description: >
        Runs `SELECT 1`. Answers 503 while the database is unreachable, which is the
        signal a proxy or supervisor should read as "do not route traffic here yet".
        Never cached.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [ready] }
                          database: { type: string, enum: [ok] }
                          timestamp: { type: string, format: date-time }
        '503':
          $ref: '#/components/responses/Error'

  /health/diagnostics:
    get:
      tags: [Health]
      summary: Recent operational events
      description: >
        The newest 40 entries of a bounded in-memory ring. Every field is allowlisted
        (see utils/diagnosticLog.ts) — no free-form messages, paths or identifiers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            at: { type: string, format: date-time }
                            level: { type: string, enum: [info, warn, error] }
                            area: { type: string, enum: [api, download, restore, sync] }
                            event: { type: string }
                            requestId: { type: string, nullable: true }
                            jobId: { type: string, nullable: true }
                            code: { type: string, nullable: true }
                            counts:
                              type: object
                              additionalProperties: { type: integer }

  /health/runtime:
    get:
      tags: [Health]
      summary: Process and database facts for the diagnostic report
      description: >
        Admin only (loopback passes; a remote client sends X-Admin-Token when ADMIN_TOKEN
        is set). Node version, uptime, memory, which optional settings are configured (as
        booleans), applied migrations, row counts and download states. No paths or values.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          node: { type: string }
                          platform: { type: string }
                          nodeEnv: { type: string, nullable: true }
                          uptimeSeconds: { type: integer }
                          memoryMb:
                            type: object
                            additionalProperties: { type: integer }
                          features:
                            type: object
                          migrations:
                            type: object
                            nullable: true
                            properties:
                              applied: { type: integer }
                              latest: { type: string, nullable: true }
                              failed: { type: integer }
                          counts:
                            type: object
                            additionalProperties: { type: integer, nullable: true }
                          downloads:
                            type: object
                            nullable: true
                            additionalProperties: { type: integer }
        '403':
          $ref: '#/components/responses/Error'

  /health/scraper:
    get:
      tags: [Health]
      summary: Anti-detection stack statistics
      description: >
        Requires a session. Reports proxy health, ban and rate-limit counts, HTML cache
        hit rate and circuit-breaker state. Builds that ship no anti-detection stack (the
        desktop installer) answer 200 with `available: false`.
      responses:
        '200':
          description: OK, or OK-but-unavailable on a build without the stack
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          available: { type: boolean }
                          reason: { type: string }
                          enabled: { type: boolean }
        '401':
          $ref: '#/components/responses/Error'

  # ── Added with the route drift test (tests/openapiRoutes.test.ts) ──────────
  /auth/register:
    post:
      tags: [Auth]
      summary: 'Create an account. 403 when REGISTRATION=closed and the caller is not the server host'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 'Sign in and set the session cookie'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 'Sign out and clear the session cookie'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /auth/me:
    get:
      tags: [Auth]
      summary: 'The signed-in account, or null'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Auth]
      summary: 'Delete the account. Requires the password'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /auth/password:
    post:
      tags: [Auth]
      summary: 'Change the password and sign out other sessions'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /auth/devices/register:
    post:
      tags: [Auth]
      summary: 'Register a device for sync'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /auth/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: 'Sign out every other session'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /category/state:
    get:
      tags: [Category]
      summary: "The caller's categories, each with the titles in it"
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /category/import:
    post:
      tags: [Category]
      summary: 'Add categories held locally, reusing existing names and skipping unknown titles'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        default:
          $ref: '#/components/responses/Error'

  /category/{category_id}/manga/{manga_id}:
    put:
      tags: [Category]
      summary: "Put a title in one of the caller's categories"
      parameters:
