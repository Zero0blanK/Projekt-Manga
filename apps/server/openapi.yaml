components:
  parameters:
    MangaId:
      name: manga_id
      in: path
      required: true
      schema: { type: string }
      description: manga.id or manga.slug
    MangaSlug:
      name: manga_slug
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: { type: string }
    ChapterId:
      name: chapter_id
      in: path
      required: true
      description: A stored chapter's own id (`ChapterRecord.id`).
      schema: { type: string }
    SourceChapterKey:
      name: source_chapter_key
      in: path
      required: true
      description: The source's own id for the chapter, unique only within its title.
      schema: { type: string }
    ChapterIdCamel:
      name: chapterId
      in: path
      required: true
      schema: { type: string }
    DownloadId:
      name: downloadId
      in: path
      required: true
      schema: { type: string }
    SourceId:
      name: source_id
      in: path
      required: true
      schema: { type: string }
    SortBy:
      name: sortBy
      in: query
      schema: { type: string, enum: [title, dateAdded, recentlyRead] }
    SortOrder:
      name: sortOrder
      in: query
      schema: { type: string, enum: [asc, desc] }
    Limit:
      name: limit
      in: query
      schema: { type: integer }
    Offset:
      name: offset
      in: query
      schema: { type: integer }
    FiltersQuery:
      name: filters
      in: query
      description: JSON-encoded object, e.g. filters={"status":"ongoing"}
      schema: { type: string }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MangaListItemArray:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MangaListItem'

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code:
          type: string
          description: >
            Present when the client is expected to act on the reason. CHALLENGE_REQUIRED
            (with 503) means the source wants a browser check that the desktop app can open.
          example: CHALLENGE_REQUIRED
        errors:
          type: object
          description: Field messages, on a VALIDATION_ERROR only.
          additionalProperties:
            type: array
            items: { type: string }

    SourceNetworkConfig:
      type: object
      properties:
        userAgent: { type: string, nullable: true }
        dohUrl: { type: string, nullable: true }
    SourceBrowserSessionStatus:
      type: object
      properties:
        sourceId: { type: string }
        hosts:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }
        userAgent: { type: string, nullable: true }
        cookies:
          type: array
          description: The stored cookies' names and expiry, never their values.
          items:
            type: object
            properties:
              name: { type: string }
              domain: { type: string }
              expires: { type: number, nullable: true, description: Unix seconds }

    Manga:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        author: { type: string }
        source: { type: string }
        thumbnail_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MangaDetailSummary:
      type: object
      properties:
        status: { type: string, example: ONGOING }
        genres: { type: string, description: comma-separated }
        description: { type: string }

    MangaListItem:
      allOf:
        - $ref: '#/components/schemas/Manga'
        - type: object
          properties:
            chapter_count: { type: integer }
            latest_chapter_date: { type: string, format: date-time, nullable: true }
            unread_count: { type: integer }
            manga_detail:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/MangaDetailSummary' }]

    MangaWithDetails:
      allOf:
        - $ref: '#/components/schemas/Manga'
        - type: object
          properties:
            status: { type: string }
            genres: { type: string }
            description: { type: string }
            rating: { type: number, nullable: true }
            chapters:
              type: array
              items: { $ref: '#/components/schemas/ChapterRecord' }

    AddMangaPayload:
      type: object
      required: [source, title, slug, author, thumbnail_url, description, genres, status]
      properties:
        source: { type: string }
        title: { type: string }
        slug: { type: string }
        author: { type: string }
        thumbnail_url: { type: string }
        artist: { type: string }
        description: { type: string }
        genres: { type: string }
        status:
          type: string
          description: Any string; mapped to the MangaStatus enum server-side, unrecognized values fall back to UNKNOWN.
        rating: { type: number }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/ChapterMeta' }

    MangaCategoryLink:
      type: object
      properties:
        manga_id: { type: string }
        category_id: { type: string }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChapterMeta:
      description: Partial chapter metadata sent from the client/source when a chapter may not exist in the DB yet.
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        chapter_number: { type: number }
        scanlator: { type: string }
        last_page_read: { type: integer }
        page_count: { type: integer }
        release_date: { type: string }
        source: { type: string }

    ChapterRecord:
      type: object
      properties:
        id:
          type: string
          description: The app's own id for the chapter; never changes, even on a relink.
        source: { type: string }
        manga_slug: { type: string }
        source_chapter_key:
          type: string
          description: The source's own id for the chapter, unique within source + manga_slug.
        manga_id: { type: string, nullable: true }
        url: { type: string }
        name: { type: string, nullable: true }
        scanlator: { type: string, nullable: true }
        is_read: { type: boolean }
        is_bookmark: { type: boolean }
        chapter_number: { type: number }
        last_page_read: { type: integer }
        page_count: { type: integer, nullable: true }
        fetched_at: { type: string, format: date-time, nullable: true }
        release_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BulkMarkResult:
      type: object
      properties:
        count: { type: integer }
        failed_source_chapter_keys:
          type: array
          items: { type: string }

    MangaHistoryInput:
      type: object
      required: [source, manga_slug, pages_read]
      properties:
        source: { type: string }
        manga_id: { type: string }
        manga_slug: { type: string }
        source_chapter_key:
          type: string
          description: The source's own id for the chapter, within source + manga_slug.
        thumbnail_url: { type: string }
        pages_read: { type: integer }
        time_read:
          type: integer
          description: Milliseconds; accumulates on repeat calls for the same chapter.

    DownloadStatusResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, IN_PROGRESS, PAUSED, COMPLETED, FAILED] }
        mangaTitle: { type: string }
        chapterTitle: { type: string }
        filePath: { type: string }
        completedAt: { type: string, format: date-time, nullable: true }

    DownloadSummary:
      type: object
      properties:
        id: { type: string }
        manga_id: { type: string }
        chapter_id: { type: string }
        source_chapter_key: { type: string }
        source_id: { type: string }
        mangaSlug: { type: string }
        status: { type: string }
        mangaTitle: { type: string }
        chapterTitle: { type: string }
        chapterNumber: { type: number }
        pages_total: { type: integer }
        pages_downloaded: { type: integer }
        current_page: { type: integer }
        filePath: { type: string }
        downloaded_path: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    DownloadStats:
      type: object
      properties:
        total: { type: integer }
        completed: { type: integer }
        inProgress: { type: integer }
        failed: { type: integer }
        totalSize: { type: integer, description: bytes }

    SourceSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        lang: { type: string }
        base_url: { type: string }
        isNSFW: { type: boolean }

    CacheStatus:
      type: object
      properties:
        exists: { type: boolean }
        manga_id: { type: string }
        thumbnail_url: { type: string }
        sha256_url: { type: string }
